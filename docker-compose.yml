services:
  qdrant:
    image: qdrant/qdrant:v1.18.1
    container_name: rag-souverain-qdrant
    security_opt:
      - apparmor=unconfined
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped